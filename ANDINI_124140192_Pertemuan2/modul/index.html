<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Next Gen Praktikum</title>
  <!-- CDN Tailwind CSS bawaan modul -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

  <!-- Halaman Konten -->
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-blue-600 mb-2">JavaScript Next Gen Praktikum</h1>
    <p class="text-gray-600 mb-6">Belajar fitur modern JavaScript (ES6+)</p>

    <div class="bg-white p-6 rounded-xl shadow-md mb-6">
      <div class="flex gap-3 mb-4">
        <button id="runBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium">Run Demo</button>
        <button id="clearBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium">Clear Output</button>
      </div>

      <div id="output" class="mt-4"></div>
    </div>
  </div>

  <!-- Panggil main.js sesuai folder js/ -->
  <script type="module" src="./js/modules/js/modules/js/main.js"></script>
</body>
</html>
