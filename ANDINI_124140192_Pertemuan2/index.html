<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-100 p-6">

  <div class="max-w-xl mx-auto space-y-4">
    
    <!-- Salam & Waktu -->
    <div class="bg-sky-50 border border-sky-200 p-4 rounded-xl shadow-sm">
      <h1 id="salam" class="text-xl font-bold text-slate-800">Selamat Datang</h1>
      <p id="jam" class="text-pink-500 font-mono text-lg font-semibold mt-1">00:00:00</p>
    </div>

    <!-- Quote dari API / Teks Motivasi -->
    <div class="bg-sky-50 border border-sky-200 p-4 rounded-xl shadow-sm">
      <p id="quoteText" class="italic text-slate-700">Loading quote...</p>
      <p id="quoteAuthor" class="text-right text-sm text-pink-500 font-medium mt-1"></p>
    </div>

    <!-- To-Do List -->
    <div class="bg-sky-50 border border-sky-200 p-4 rounded-xl shadow-sm">
      <h2 class="font-bold text-lg mb-3 text-slate-800">Tugas Harian</h2>
      
      <!-- Input & Tombol Tambah Pink -->
      <div class="flex gap-2 mb-3">
        <input type="text" id="inputTugas" placeholder="Tulis tugas..." class="border border-sky-200 p-2 flex-1 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 bg-white">
        <button id="btnTambah" class="bg-pink-400 hover:bg-pink-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shadow-sm">Tambah</button>
      </div>

      <!-- Tombol Filter -->
      <div class="flex gap-2 mb-3 text-xs">
        <button id="btnSemua" class="bg-pink-100 text-pink-700 px-3 py-1.5 rounded-lg transition-colors">Semua</button>
        <button id="btnBelum" class="bg-pink-100 text-pink-700 px-3 py-1.5 rounded-lg transition-colors">Belum Selesai</button>
        <button id="btnSelesai" class="bg-pink-100 text-pink-700 px-3 py-1.5 rounded-lg transition-colors">Selesai</button>
      </div>

      <ul id="listTugas" class="space-y-2"></ul>
    </div>

    <!-- Fitur Baru: Catatan Cepat -->
    <div class="bg-sky-50 border border-sky-200 p-4 rounded-xl shadow-sm">
      <h2 class="font-bold text-lg mb-2 text-slate-800">Note</h2>
      <textarea id="inputCatatan" rows="3" placeholder="Tulis catatan penting di sini..." class="w-full border border-sky-200 p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 bg-white text-slate-700 resize-none"></textarea>
    </div>

  </div>

  <script type="module" src="./dashboard.js"></script>
</body>
</html>
